# Label Sync Workflow
#
# Synchronizes .github/labels.yml to the GitHub repository labels.
# Triggers:
#   - Manual: workflow_dispatch (admin-initiated, dry-run support)
#   - Automatic: push to main when .github/labels.yml or this workflow file changes
#
# Source of truth: .github/labels.yml
# Action reference: https://github.com/EndBug/label-sync

name: Label Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without applying (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/label-sync.yml"

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  sync:
    name: Sync repository labels from labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag. A tag is
      # mutable: whoever controls the action's repo can repoint v2/v4 at new
      # code, which would then run here with the issues:write and
      # pull-requests:write permissions granted below and the repository's
      # GITHUB_TOKEN. That is the tj-actions/changed-files supply-chain pattern.
      # Update deliberately: re-resolve the tag, read the diff, then bump.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        with:
          config-file: .github/labels.yml
          # delete-other-labels: false — preserve labels not in labels.yml (e.g., bot-managed labels)
          # request-options: see https://github.com/EndBug/label-sync for advanced behavior
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
